[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "chatbot-backend"
version = "0.1.0"
description = "FastAPI transport for the provider-neutral chatbot core."
requires-python = ">=3.12"
dependencies = [
    "chatbot",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "anyio>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
