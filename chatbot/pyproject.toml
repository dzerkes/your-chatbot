[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "chatbot"
version = "0.1.0"
description = "Provider-neutral chatbot core, independent of the web layer."
requires-python = ">=3.12"
dependencies = [
    "anyio>=4,<5",
    "httpx>=0.27,<1",
    "anthropic>=2.8,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "openai>=3.49,<4",
    "mcp>=2.3,<3",
    "pyjwt>=2.10,<3",
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[project.optional-dependencies]
# ONNX embedding model for `local:` embedders; kept optional so images that only
# migrate the schema do not install onnxruntime.
local-embeddings = ["fastembed>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.uv]
# Rebuild this package when its sources change, not only its pyproject.toml.
# Without this, Docker builds that share uv's cache installed stale code.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
