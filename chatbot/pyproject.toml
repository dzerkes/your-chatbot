[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "chatbot"
version = "0.1.0"
description = "Provider-neutral chatbot core, independent of the web layer."
requires-python = ">=3.12"
dependencies = [
    "anyio>=4,<5",
    "anthropic>=2.8,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "openai>=3.49,<4",
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]
